# Netlify configuration for Property Sales Frontend (SPA)

[build]
command = "npm run build"
publish = "dist"
functions = "functions"

# Environment variables (set these in Netlify dashboard)
# VITE_API_BASE_URL
# VITE_AUTH_API_BASE_URL  
# VITE_PRODUCT_API_BASE_URL

# Redirect all routes to index.html for SPA routing
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Cache settings
[[headers]]
for = "/dist/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.js"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.css"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
